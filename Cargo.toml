[package]
name = "cryptaudit"
version = "0.1.0"
edition = "2024"
authors = ["Shubham Chhatbar", "Rahul Paul"]
description = "Static analysis for cryptographic API misuse in Rust code (cargo subcommand: cargo cryptaudit)"
license = "Apache-2.0"
readme = "README.md"
rust-version = "1.85"
repository = "https://github.com/Shubham-0-0-7/cryptaudit"
keywords = ["cryptography", "security", "static-analysis", "audit", "lint"]
categories = ["development-tools::cargo-plugins", "cryptography"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "cargo-cryptaudit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }

[dev-dependencies]
insta = "1"
