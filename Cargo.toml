[package]
name = "cryptaudit"
version = "0.1.0"
edition = "2024"
authors = ["Shubham Chhatbar", "Rahul Paul"]
description = "Static analysis for cryptographic API misuse in Rust code (cargo subcommand: cargo cryptaudit)"
license = "Apache-2.0"
readme = "README.md"
keywords = ["cryptography", "security", "static-analysis", "audit", "lint"]
categories = ["development-tools::cargo-plugins", "cryptography"]

[[bin]]
name = "cargo-cryptaudit"
path = "src/main.rs"

